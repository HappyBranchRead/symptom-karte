<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI駆動開発 症状カルテ</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><header><a class="brand" href="/">＋ 症状カルテ <small>AI駆動開発 / CASE STUDY</small></a><button id="theme" aria-label="配色を切り替え">配色切替</button></header><main><div class="eyebrow">TEAM WORKSHOP · 2026.10.23</div><h1>症状から、<br>チームの仕組みを考える。</h1><details class="context"><summary>ケーススタディの状況を確認</summary><p id="situation"></p></details><p class="notice">架空事例の話だけを入力してください。実際の案件名や顧客名は書かないでください。</p><section id="picker" hidden><h2>担当グループを選んでください</h2><div id="group-links" class="grid"></div><a href="/admin.html">ファシリテーター画面へ →</a></section><div id="workspace" hidden><div class="section-head"><span id="group-label" class="eyebrow"></span><span id="phase" class="badge">ワーク中</span></div><section id="case" class="case-card"></section><section class="timer"><div><span class="eyebrow">WORK TIMER</span><select id="step" aria-label="ワークのステップ"><option value="120">ステップ1 · 2分</option><option value="720">ステップ2 · 12分</option><option value="480">ステップ3 · 8分</option><option value="180">発表準備 · 3分</option></select></div><strong id="clock" role="timer">02:00</strong><div><button id="start">開始</button><button id="reset-timer">リセット</button></div></section><div class="section-head"><h2>議論をカルテに残す</h2><span id="save-status" role="status">読み込み中…</span></div><form id="fields" class="grid"></form><div class="section-head"><span>入力が止まってから2秒後に自動保存</span><button id="present">発表用カルテを表示 ↗</button></div><section id="presentation" class="presentation" hidden></section><section id="shared" hidden><div class="section-head"><h2>全グループのカルテ</h2><span class="badge">全体公開</span></div><div id="shared-cards" class="grid"></div></section></div></main><footer>AI駆動開発 症状カルテ <span>入力データは最終保存から7日で自動削除</span></footer></body></html>
