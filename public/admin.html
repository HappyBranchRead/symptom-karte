<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ファシリテーター | 症状カルテ</title><link rel="stylesheet" href="/style.css"><script type="module" src="/admin.js"></script></head><body><header><a class="brand" href="/">＋ 症状カルテ <small>FACILITATOR</small></a><button id="theme">配色切替</button></header><main><div class="eyebrow">WORKSHOP CONTROL</div><h1>議論を見渡す。</h1><form id="login" class="login case-card"><h2>ファシリテーター画面</h2><label for="pass">合言葉</label><input id="pass" type="password" autocomplete="current-password" required><button class="primary">集約画面を開く →</button></form><p id="status" role="status"></p><div id="dashboard" hidden><div class="toolbar"><span id="phase" class="badge"></span><button id="toggle-phase" class="primary"></button><button id="present">発表モード</button><label><input id="hints" type="checkbox"> ヒントを表示</label><button id="export">Markdownをコピー</button><button id="download">ダウンロード</button><button id="logout">ログアウト</button></div><div id="navigation" class="toolbar" hidden><button id="previous">← 前へ</button><span id="slide-number"></span><button id="next">次へ →</button></div><div id="cards" class="grid"></div><aside id="conclusion" class="case-card" hidden></aside><details class="case-card"><summary>配布用グループURL</summary><div id="links"></div><p>各URLをQRコード化して配布できます。</p></details><div class="danger-zone"><p>終了後は記録を書き出してから削除してください。</p><button id="reset" class="danger">全入力をリセット</button></div></div></main><footer>AI駆動開発 症状カルテ <span>5秒ごとに更新</span></footer></body></html>
